name: Research data

# Pulls public data for the ride-demand model (research/pull.py) and commits it to research/data/.
# Runs when research/jobs.json or research/pull.py changes; the steps are listed in jobs.json.
on:
  push:
    branches: [main]
    paths: ['research/jobs.json', 'research/pull.py', '.github/workflows/research.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: python3 -m pip install --quiet shapely pyshp
      - name: Pull data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          COMMIT_EACH_STEP: '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 research/pull.py
      - name: Commit and push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A research/data 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Research data"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
