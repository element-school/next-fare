name: Flight schedules

# Writes data/flights/YYYY-MM-DD.json (SEA hourly arrivals/departures, PAE arrival times)
# from AeroDataBox. Needs the repository secret AERODATABOX_KEY (a free RapidAPI key).
on:
  schedule:
    - cron: '7 2 * * *'   # 02:07 UTC: about 7 PM Pacific in summer, 6 PM in winter; fetches tomorrow
  workflow_dispatch:
    inputs:
      dates:
        description: 'Dates to fetch (YYYY-MM-DD, comma-separated). Empty = today and tomorrow.'
        required: false
  push:
    branches: [main]
    paths: ['scripts/flights.py', '.github/workflows/flights.yml']

permissions:
  contents: write

concurrency:
  group: flights
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch flight schedules
        env:
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
          DATES: ${{ github.event.inputs.dates }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/flights.py
      - name: Commit and push
        run: |
          git add -A data/flights 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Flight schedules"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
